<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play the Touch of Music piano with your keyboard or touchscreen.">
  <title>Touch of Music</title>
  <link rel="stylesheet" href="player.css">
  <script type="module" src="player.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">A LITTLE INSTRUMENT FOR YOUR BROWSER</p>
      <h1>Touch of Music</h1>
      <p>Play with your keyboard, mouse, or touchscreen.</p>
    </header>

    <section class="controls" aria-label="Instrument settings">
      <label>Key <select id="key"></select></label>
      <label>Mode <select id="mode"></select></label>
      <label>Octave <select id="octave">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
      </select></label>
      <label class="checkbox"><input type="checkbox" id="chords" checked> Play chords on the bottom row</label>
    </section>

    <section class="instrument" aria-label="Music keyboard">
      <div class="instrument-heading">
        <div>
          <h2>Make some music</h2>
          <p>Hold Shift to sharpen a single note. Keys use the original layout.</p>
        </div>
        <p id="scale" class="scale"></p>
      </div>
      <div id="keyboard" class="keyboard"></div>
      <p id="status" role="status" aria-live="polite">Ready to play.</p>
    </section>
    <p class="footnote">Some notes at the edges of the piano are unavailable in higher or lower keys and octaves.</p>
  </main>
</body>
</html>
